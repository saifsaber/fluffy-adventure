name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      # The balance gate. `CLAUDE.md` is explicit that failing it blocks the merge and that the
      # engine gets fixed rather than the thresholds lowered — so it has to actually run, not sit in
      # a document. It was deliberately left out of CI until it passed, because a permanently red
      # pipeline teaches everyone to ignore the pipeline.
      #
      # Forty-five seasons, 17,100 matches, about 34 s since the zone-lookup speedup — it used to be
      # twenty. Forty-five is the sample size every balance figure in the docs is quoted at, and the
      # xG correlation sits close enough to its floor that a smaller n reports noise rather than a
      # regression. CI now measures the same thing the blueprint claims. The full 10,000-season run
      # stays out: it is roughly two hours, for a balance decision that actually rests on it.
      - run: pnpm harness -- --seasons=45
